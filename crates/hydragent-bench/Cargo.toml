[package]
name = "hydragent-bench"
version = "0.1.0"
edition = "2021"

[lib]
name = "hydragent_bench"
path = "src/lib.rs"

[dependencies]
hydragent-types  = { path = "../hydragent-types" }
hydragent-skills = { path = "../hydragent-skills" }
# Only needed by the `task_bench` binary that drives the live ReAct
# loop. We keep these as optional-ish by only including them in the
# specific bin's dep set… but `cargo` doesn't make that easy at the
# workspace level, so we just add them at the crate root and pay
# the cost in compile time when building `hydragent-bench`.
hydragent-core   = { path = "../hydragent-core" }
hydragent-vault  = { path = "../hydragent-vault" }
hydragent-model  = { path = "../hydragent-model" }
hydragent-tools  = { path = "../hydragent-tools" }
hydragent-memory = { path = "../hydragent-memory" }
hydragent-embed  = { path = "../hydragent-embed" }
serde      = { workspace = true }
serde_json = { workspace = true }
tokio      = { workspace = true }
anyhow     = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }
chrono     = { workspace = true }
clap       = { workspace = true }
uuid       = { workspace = true }
futures-util = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "bench"
path = "bin/bench.rs"

[[bin]]
name = "task_bench"
path = "bin/task_bench.rs"
