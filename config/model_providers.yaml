version: 1
defaults:
  chat: openrouter/openai-gpt-4o-mini
  planning: openrouter/deepseek-deepseek-r1
  coding: openrouter/deepseek-deepseek-coder
  research: openrouter/perplexity-sonar
  utility: openrouter/openai-gpt-4o-mini
  inline_chat: ollama/llama3.1
providers:
  - id: openrouter
    display_name: OpenRouter
    kind: openrouter
    default_base_url: https://openrouter.ai/api/v1
    auth_mode: api_key
    supports_custom_models: true
    supports_reasoning: true
    supports_tools: true
    supports_vision: true
  - id: openai
    display_name: OpenAI
    kind: custom_openai
    default_base_url: https://api.openai.com/v1
    auth_mode: api_key
    supports_reasoning: true
    supports_tools: true
    supports_vision: true
  - id: ollama
    display_name: Ollama
    kind: ollama
    default_base_url: http://localhost:11434/v1
    auth_mode: none
    supports_custom_models: true
  - id: lmstudio
    display_name: LM Studio
    kind: custom_openai
    default_base_url: http://localhost:1234/v1
    auth_mode: none
  - id: custom
    display_name: Custom OpenAI-compatible endpoint
    kind: custom_openai
    default_base_url: ""
    auth_mode: api_key
models:
  - id: openai-gpt-4o-mini
    provider_id: openrouter
    name: GPT-4o Mini
    aliases:
      - gpt-4o-mini
    api_model_id: openai/gpt-4o-mini
    tool_calling: true
    vision: true
    streaming: true
    max_input_tokens: 128000
    max_output_tokens: 16384
    cost_per_1k: 0.00015
    cost_tier: cheap
  - id: openai-gpt-4o
    provider_id: openrouter
    name: GPT-4o
    aliases:
      - gpt-4o
    api_model_id: openai/gpt-4o
    tool_calling: true
    vision: true
    streaming: true
    max_input_tokens: 128000
    max_output_tokens: 16384
    cost_per_1k: 0.005
    cost_tier: premium
  - id: deepseek-deepseek-coder
    provider_id: openrouter
    name: DeepSeek Coder
    aliases:
      - deepseek-coder
    api_model_id: deepseek/deepseek-coder
    tool_calling: true
    streaming: true
    max_input_tokens: 128000
    max_output_tokens: 8192
    cost_per_1k: 0.00014
    cost_tier: cheap
  - id: deepseek-deepseek-r1
    provider_id: openrouter
    name: DeepSeek R1
    aliases:
      - deepseek-r1
    api_model_id: deepseek/deepseek-r1
    reasoning: true
    streaming: true
    max_input_tokens: 128000
    max_output_tokens: 8192
    cost_per_1k: 0.002
    cost_tier: standard
  - id: perplexity-sonar
    provider_id: openrouter
    name: Perplexity Sonar
    aliases:
      - sonar
    api_model_id: perplexity/sonar
    streaming: true
    max_input_tokens: 127000
    max_output_tokens: 4096
    cost_per_1k: 0.001
    cost_tier: standard
  - id: openai-gpt-4o-mini-openai
    provider_id: openai
    name: GPT-4o Mini
    aliases:
      - gpt-4o-mini
    api_model_id: gpt-4o-mini
    tool_calling: true
    vision: true
    streaming: true
    max_input_tokens: 128000
    max_output_tokens: 16384
    cost_per_1k: 0.00015
    cost_tier: cheap
  - id: openai-gpt-4o-openai
    provider_id: openai
    name: GPT-4o
    aliases:
      - gpt-4o
    api_model_id: gpt-4o
    tool_calling: true
    vision: true
    streaming: true
    max_input_tokens: 128000
    max_output_tokens: 16384
    cost_per_1k: 0.005
    cost_tier: premium
  - id: llama3.1
    provider_id: ollama
    name: Llama 3.1
    aliases: []
    api_model_id: llama3.1
    streaming: true
    max_input_tokens: 128000
    max_output_tokens: 8192
    cost_per_1k: 0.0
    cost_tier: free
  - id: qwen2.5-coder
    provider_id: ollama
    name: Qwen2.5 Coder
    aliases: []
    api_model_id: qwen2.5-coder
    tool_calling: true
    streaming: true
    max_input_tokens: 128000
    max_output_tokens: 8192
    cost_per_1k: 0.0
    cost_tier: free
  - id: local-model
    provider_id: lmstudio
    name: Local Model
    aliases: []
    api_model_id: local-model
    streaming: true
    max_input_tokens: 32000
    max_output_tokens: 4096
    cost_per_1k: 0.0
    cost_tier: free
  - id: custom-model
    provider_id: custom
    name: Custom Model
    aliases: []
