# ============================================================================
# Hydragent Model & Provider Configuration Registry
# ============================================================================
# This file defines defaults, providers, and models used by Hydragent.
#
# How to Configure API Keys:
# -------------------------
# For any provider requiring an API key (e.g. OpenRouter, OpenAI), you can:
#   1. In the chat REPL, run: `/provider set <provider_id> key <your-key>`
#      This will securely encrypt and save the key to your Lockbox.
#   2. Set it in the `.env` file at the install root as:
#      `BRAIN_<PROVIDER_ID_UPPERCASE>_KEY=<your-key>`
#      (e.g., `BRAIN_OPENROUTER_KEY=sk-or-or-or-...`)
#
# Default Active Provider/Model is configured below.
# ============================================================================

version: 1
defaults:
  chat: ollama/llama3.1
  planning: ollama/llama3.1
  coding: ollama/llama3.1
  research: ollama/llama3.1
  utility: ollama/llama3.1
  inline_chat: ollama/llama3.1

providers:
  - id: openrouter
    display_name: OpenRouter
    kind: openrouter
    default_base_url: https://openrouter.ai/api/v1
    auth_mode: api_key
    supports_custom_models: true
    supports_reasoning: true
    supports_tools: true
    supports_vision: true
    models: []

  - id: ollama
    display_name: Ollama (Local)
    kind: ollama
    default_base_url: http://localhost:11434
    auth_mode: none
    supports_custom_models: true
    supports_reasoning: true
    supports_tools: true
    default_params:
      warmup: true
      native_tool_calling: true
      structured_output: true
      thinking_mode: auto
      keep_alive: "5m"
    # Models are auto-discovered from your local Ollama installation.
    # Run `ollama pull <model>` to add a model.
    models: []

routing_profiles: []
